name: ci

on:
  workflow_call:
    inputs:
      package-manager:
        description: "Package manager of the project: npm or pnpm"
        default: "npm"
        type: string
      pnpm-version:
        description: >-
          Version of pnpm to use. Must be empty when package.json has a
          packageManager field, and is required otherwise.
        default: ""
        type: string
      node-version:
        description: "Version of Node.js to use"
        default: "lts/*"
        type: string
      node-version-file:
        description: >-
          Path from the root of the repo of the file containing the version of
          Node.js to use (e.g. .nvmrc). Takes precedence over node-version.
        default: ""
        type: string
      working-directory:
        description: "Path from the root of the repo of the project"
        default: "."
        type: string
      artifact-path:
        description: >-
          Path from the working directory of the build output to upload as the
          "site" artifact. Nothing is uploaded when empty.
        default: ""
        type: string

permissions:
  # This is required for actions/checkout.
  contents: read

env:
  PACKAGE_MANAGER: ${{ inputs.package-manager }}

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install the dependencies
        run: |
          case "${PACKAGE_MANAGER}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported package manager: ${PACKAGE_MANAGER}."
              exit 1
              ;;
          esac
      - name: Lint the project
        run: ${PACKAGE_MANAGER} run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install the dependencies
        run: |
          case "${PACKAGE_MANAGER}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported package manager: ${PACKAGE_MANAGER}."
              exit 1
              ;;
          esac
      - name: Run the unit tests
        run: ${PACKAGE_MANAGER} run --if-present test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: inputs.package-manager == 'pnpm'
        with:
          version: ${{ inputs.pnpm-version }}
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version-file == '' && inputs.node-version || '' }}
          node-version-file: ${{ inputs.node-version-file }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ inputs.working-directory }}/${{ inputs.package-manager == 'pnpm' && 'pnpm-lock.yaml' || 'package-lock.json' }}
      - name: Install the dependencies
        run: |
          case "${PACKAGE_MANAGER}" in
            npm) npm ci ;;
            pnpm) pnpm install --frozen-lockfile ;;
            *)
              echo "::error::Unsupported package manager: ${PACKAGE_MANAGER}."
              exit 1
              ;;
          esac
      - name: Build the project
        run: ${PACKAGE_MANAGER} run build
      - name: Upload the build output
        if: inputs.artifact-path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
