name: docs

on:
  workflow_call:
    inputs:
      build-dir:
        description:
          "The path from the root of the repo where we should run the zola build command"
        default: "."
        required: false
        type: string

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      # This is required for actions/checkout.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.59.0"
      - name: lint sass
        run: just lint-sass
      - name: lint markdown
        run: just lint-md
      - name: Check spelling
        run: just lint-spellcheck

  build:
    runs-on: ubuntu-latest
    permissions:
      # This is required for actions/checkout.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: build
        uses: shalzz/zola-deploy-action@06dffc1b49e4f61b31dcf3a6c824194a78216632 # v0.23.1
        env:
          BUILD_DIR: ${{ inputs.build-dir }}
          BUILD_ONLY: true
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: ${{ inputs.build-dir }}/public
          if-no-files-found: error
          include-hidden-files: true

  # Publishes the site from the build job, so what is deployed is what was built.
  # The permissions are inherited: requesting `contents: write` here would be
  # checked against the caller even when this job is skipped.
  deploy:
    runs-on: ubuntu-latest
    needs:
      - lint
      - build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: docs-zola-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: public
      - name: Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: public
          # Keep a single commit on the GitHub pages branch.
          force_orphan: true
